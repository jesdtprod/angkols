<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angkol's Table Order</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#071326;color:#edf6ff;font:16px Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px}.brand{color:#26b6ff;font-weight:800;letter-spacing:.08em}.card{background:#0d1d35;border:1px solid #194a83;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.price{color:#30c7ff;font-weight:bold}button,input,textarea{font:inherit;border-radius:10px;padding:10px;border:1px solid #27588f;background:#071326;color:#fff}button{background:#087df4;border:0;font-weight:bold;cursor:pointer}textarea{width:100%;box-sizing:border-box}small{color:#9fb2ca}</style></head><body><main class="wrap"><p class="brand">ANGKOL'S GRILL &amp; RESTOBAR</p><h1 id="title">Loading menu…</h1><p id="status">Please wait.</p><section id="menu"></section><section class="card"><h3>Your order</h3><div id="cart">No items selected.</div><textarea id="note" maxlength="180" placeholder="Notes for the waiter (optional)"></textarea><p><button id="submit" disabled>Send request to waiter</button></p></section></main><script>
const token=new URLSearchParams(location.search).get('table');const client=window.supabase.createClient(window.CE_POS_SUPABASE.url,window.CE_POS_SUPABASE.publishableKey);let menu=[],cart=[];const peso=n=>'PHP '+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function draw(){document.querySelector('#menu').innerHTML=menu.map(p=>`<article class="card"><div class="row"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.category||'Menu')}</small></div><div class="price">${peso(p.price)}</div><button data-id="${p.id}">Add</button></div></article>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const item=cart.find(x=>x.productId===id);if(item)item.qty++;else cart.push({productId:id,qty:1});drawCart()})}function drawCart(){document.querySelector('#cart').innerHTML=cart.length?cart.map(x=>{const p=menu.find(y=>y.id===x.productId);return `<div class="row"><span>${x.qty} × ${esc(p.name)}</span><button data-remove="${x.productId}">Remove</button></div>`}).join(''):'No items selected.';document.querySelector('#submit').disabled=!cart.length;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.productId!==b.dataset.remove);drawCart()})}
(async()=>{if(!token){document.querySelector('#status').textContent='Missing table QR code.';return}const {data,error}=await client.rpc('public_table_menu',{token_input:token});if(error){document.querySelector('#status').textContent=error.message;return}menu=data.products||[];document.querySelector('#title').textContent=data.tableName;document.querySelector('#status').textContent='Add items, then send the request to your waiter.';draw()})();document.querySelector('#submit').onclick=async()=>{const button=document.querySelector('#submit');button.disabled=true;const {error}=await client.rpc('submit_table_order_request',{token_input:token,lines:cart,note_input:document.querySelector('#note').value});if(error){alert(error.message);button.disabled=false;return}cart=[];document.querySelector('#note').value='';drawCart();alert('Request sent. Your waiter will confirm it shortly.');};
</script></body></html>
