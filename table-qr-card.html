<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angkol's Table QR</title><style>body{margin:0;background:#071326;color:#eef7ff;font-family:Arial,sans-serif}.card{width:360px;margin:32px auto;text-align:center;background:#0d1d35;border:2px solid #1687ff;border-radius:24px;padding:28px}.brand{color:#35c6ff;font-weight:800;letter-spacing:.08em}.qr{width:280px;height:280px;background:#fff;padding:12px;border-radius:14px;margin:18px auto}.qr img{width:100%;height:100%}h1{margin:10px 0;font-size:32px}p{color:#a9bcd3}button{border:0;border-radius:10px;background:#1687ff;color:#fff;padding:12px 20px;font-weight:bold;cursor:pointer}@media print{body{background:#fff;color:#071326}.card{margin:0;border-color:#071326}.brand{color:#071326}p{color:#334155}button{display:none}}</style></head><body><main class="card"><div class="brand">ANGKOL'S GRILL &amp; RESTOBAR</div><p>Scan to order from your table</p><h1 id="tableName">Dining Table</h1><div class="qr"><img id="qr" alt="Table ordering QR code"></div><p>Orders are confirmed by your waiter before preparation.</p><button onclick="print()">Print QR Card</button></main><script>const q=new URLSearchParams(location.search),table=q.get('table')||'',name=q.get('name')||'Dining Table',url=`${location.origin}${location.pathname.replace(/[^/]+$/,'')}table-order.html?table=${encodeURIComponent(table)}`;document.querySelector('#tableName').textContent=name;document.querySelector('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=560x560&data='+encodeURIComponent(url);</script></body></html>
